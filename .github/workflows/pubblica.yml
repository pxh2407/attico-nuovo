# Pubblica l'anteprima su GitHub Pages e, ogni mezz'ora, copia dal sito ufficiale
# le date occupate del calendario (solo inizio e fine, nessun altro dato).
name: Pubblica anteprima con calendario aggiornato

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepara il sito e scarica le date occupate
        run: |
          mkdir -p _site
          cp -r index.html stile.css app.js testi.js images en de fr _site/
          if curl -fsS --max-time 30 -A "AtticoAnteprima/1.0" "https://www.atticopanoramico.it/calendar-proxy.php" -o raw.json; then
            python3 -c "import json; d=json.load(open('raw.json')); json.dump({'aggiornato': d.get('aggiornato'), 'eventi': [{'start': e['start'], 'end': e['end']} for e in d.get('eventi', [])]}, open('_site/calendar.json', 'w'))"
            echo "Date occupate copiate: $(python3 -c "import json; print(len(json.load(open('_site/calendar.json'))['eventi']))")"
          else
            echo "Calendario del sito ufficiale non raggiungibile in questo momento"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
